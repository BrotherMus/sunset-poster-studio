<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunset Poster Studio</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="brand-sun" aria-hidden="true"></span><span class="brand-name">Sunset Poster Studio</span></div>
  <div class="size-switch" id="size-switch" role="group" aria-label="Poster size"></div>
  <div class="top-actions">
    <button id="surprise" type="button" class="btn ghost">Surprise me</button>
    <button id="export" type="button" class="btn hot">Export PNG</button>
  </div>
</header>

<main class="studio">
  <aside class="side left">
    <section class="card">
      <h2>Photos</h2>
      <label class="dropzone" id="dropzone">
        <input id="photo-input" type="file" accept="image/*" multiple>
        <strong>Add photos</strong>
        <span>or drop them here · they stay on this computer</span>
      </label>
      <div class="tray" id="photo-tray" aria-label="Your photos"></div>
      <div class="row">
        <button id="spread-photos" type="button" class="btn small" title="Spread the photos across the panels">Spread photos</button>
        <button id="fill-one" type="button" class="btn small" title="Fill every panel from the active photo, each with its own crop">Fill all from one</button>
      </div>
      <button id="use-samples" type="button" class="btn small link">Try the sample photos</button>
    </section>
    <section class="card">
      <h2>Caption</h2>
      <label class="field inline"><span>Title</span><input id="caption-title" type="text" maxlength="28" value="Vice Beach"></label>
      <label class="field inline"><span>Sub-line</span><input id="caption-sub" type="text" maxlength="40" value="one last summer"></label>
      <label class="field inline"><span>Tag</span><input id="caption-tag" type="text" maxlength="28" value="Coming soon"></label>
      <div class="field inline"><span>Place</span>
        <div class="segmented" id="caption-position">
          <button type="button" data-value="auto">Auto</button><button type="button" data-value="top">Top</button><button type="button" data-value="center">Mid</button><button type="button" data-value="bottom">Low</button>
        </div>
      </div>
      <div class="field inline"><span>Lines</span>
        <div class="segmented" id="caption-lines">
          <button type="button" data-value="auto">Auto</button><button type="button" data-value="1">One</button><button type="button" data-value="2">Two</button>
        </div>
      </div>
      <label class="field inline"><span>Size</span><input id="caption-scale" type="range" min="0.6" max="1.3" step="0.01" value="1"></label>
      <label class="check"><input id="caption-slab" type="checkbox"> Coloured slab behind the title</label>
    </section>
    <section class="card">
      <h2>Layout</h2>
      <div class="layout-list" id="layout-list"></div>
    </section>
    <section class="card">
      <h2>Colour grade</h2>
      <div class="grade-list" id="grade-list"></div>
    </section>
  </aside>

  <section class="stage">
    <div class="canvas-wrap" id="canvas-wrap">
      <canvas id="poster" aria-label="Poster preview"></canvas>
      <div class="drop-hint" id="drop-hint">Drop on a panel to put the photo there</div>
    </div>
    <p class="hint" id="status" role="status">Click a panel to select it · drag to move the photo · scroll to zoom · drop a photo on a panel</p>
  </section>

  <aside class="side right">
    <section class="card" id="panel-inspector">
      <h2>Panel <span id="panel-number">1</span></h2>
      <label class="field inline"><span>Shows</span><select id="panel-source"></select></label>
      <label class="field inline"><span>Zoom</span><input id="panel-zoom" type="range" min="1" max="4" step="0.01" value="1"></label>
      <label class="field inline"><span>Role tag</span><input id="panel-role" type="text" maxlength="20" placeholder="THE DRIVER"></label>
      <label class="field inline"><span>Stamp</span><input id="panel-stamp" type="text" maxlength="40" placeholder="CORAL CAUSEWAY · 7:15 PM"></label>
      <div class="row">
        <button id="panel-flip" type="button" class="btn small">Flip</button>
        <button id="panel-reset" type="button" class="btn small">Reset crop</button>
        <button id="panel-next" type="button" class="btn small">Next ›</button>
      </div>
    </section>
    <section class="card" id="extras-card">
      <h2>Poster extras</h2>
      <div class="chips" id="extras-toggles">
        <label><input type="checkbox" data-extra="frames"><span>Frame lines</span></label>
        <label><input type="checkbox" data-extra="rays"><span>Light rays</span></label>
        <label><input type="checkbox" data-extra="roles"><span>Role tags</span></label>
        <label><input type="checkbox" data-extra="stamps"><span>Stamps</span></label>
        <label><input type="checkbox" data-extra="quote"><span>Press quote</span></label>
        <label><input type="checkbox" data-extra="seal"><span>Seal</span></label>
        <label><input type="checkbox" data-extra="tagline"><span>Tagline</span></label>
        <label><input type="checkbox" data-extra="credits"><span>Credits</span></label>
      </div>
      <label class="field inline"><span>Quote</span><input type="text" data-extra-text="quoteText" maxlength="40"></label>
      <label class="field inline"><span>Source</span><input type="text" data-extra-text="quoteSource" maxlength="30"></label>
      <label class="field inline"><span>Badge</span><input type="text" data-extra-text="vol" maxlength="12"></label>
      <label class="field inline"><span>Seal</span><input type="text" data-extra-text="sealText" maxlength="24"></label>
      <div class="field inline"><span>Seal style</span>
        <div class="row tight">
          <select data-extra-text="sealEdge" aria-label="Seal edge"><option value="jagged">Jagged</option><option value="scalloped">Scalloped</option></select>
          <select data-extra-text="sealSpot" aria-label="Seal spot"><option value="title">By title</option><option value="corner">Corner</option></select>
        </div>
      </div>
      <label class="field inline"><span>Tagline</span><input type="text" data-extra-text="taglineText" maxlength="48"></label>
      <label class="field inline"><span>Credits</span><textarea data-extra-text="creditsText" rows="2" maxlength="400"></textarea></label>
    </section>
    <section class="card">
      <h2>Effects</h2>
      <label class="field inline"><span>Grade</span><input id="fx-strength" type="range" min="0" max="1" step="0.01"></label>
      <label class="field inline"><span>Grain</span><input id="fx-grain" type="range" min="0" max="1" step="0.01"></label>
      <label class="field inline"><span>Vignette</span><input id="fx-vignette" type="range" min="0" max="1" step="0.01"></label>
      <label class="field inline"><span>Glow</span><input id="fx-glow" type="range" min="0" max="1" step="0.01"></label>
      <label class="field inline"><span>Borders</span><input id="fx-border" type="range" min="4" max="40" step="1"></label>
    </section>
  </aside>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
