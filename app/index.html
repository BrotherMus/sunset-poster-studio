<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunset Poster Studio</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="brand-sun" aria-hidden="true"></span><span class="brand-name">Sunset Poster Studio</span></div>
  <div class="size-switch" id="size-switch" role="group" aria-label="Poster size"></div>
  <div class="top-actions">
    <button id="surprise" type="button" class="btn ghost">Surprise me</button>
    <button id="export" type="button" class="btn hot">Export PNG</button>
  </div>
</header>

<main class="studio">
  <aside class="side left">
    <section class="card">
      <h2>Photos</h2>
      <label class="dropzone" id="dropzone">
        <input id="photo-input" type="file" accept="image/*" multiple>
        <strong>Add photos</strong>
        <span>or drop them here · they stay on this computer</span>
      </label>
      <div class="tray" id="photo-tray" aria-label="Your photos"></div>
      <div class="row">
        <button id="spread-photos" type="button" class="btn small">Spread across panels</button>
        <button id="fill-one" type="button" class="btn small">Fill all from one</button>
      </div>
      <button id="use-samples" type="button" class="btn small link">Try the sample photos</button>
    </section>
    <section class="card">
      <h2>Caption</h2>
      <label class="field">Title <input id="caption-title" type="text" maxlength="28" value="Vice Beach"></label>
      <label class="field">Sub-line <input id="caption-sub" type="text" maxlength="40" value="one last summer"></label>
      <label class="field">Tag <input id="caption-tag" type="text" maxlength="28" value="Coming soon"></label>
      <div class="field">Position
        <div class="segmented" id="caption-position">
          <button type="button" data-value="auto">Auto</button><button type="button" data-value="top">Top</button><button type="button" data-value="center">Middle</button><button type="button" data-value="bottom">Bottom</button>
        </div>
      </div>
      <label class="field">Lettering size <input id="caption-scale" type="range" min="0.6" max="1.3" step="0.01" value="1"></label>
      <label class="check"><input id="caption-slab" type="checkbox" checked> Coloured slab</label>
    </section>
  </aside>

  <section class="stage">
    <div class="canvas-wrap" id="canvas-wrap">
      <canvas id="poster" aria-label="Poster preview"></canvas>
      <div class="drop-hint" id="drop-hint">Drop on a panel to put the photo there</div>
    </div>
    <p class="hint" id="status" role="status">Click a panel to select it · drag to move the photo · scroll to zoom · drop a photo on a panel</p>
  </section>

  <aside class="side right">
    <section class="card" id="panel-inspector">
      <h2>Panel <span id="panel-number">1</span></h2>
      <label class="field">Shows <select id="panel-source"></select></label>
      <label class="field">Zoom <input id="panel-zoom" type="range" min="1" max="4" step="0.01" value="1"></label>
      <div class="row">
        <button id="panel-flip" type="button" class="btn small">Flip</button>
        <button id="panel-reset" type="button" class="btn small">Reset crop</button>
        <button id="panel-next" type="button" class="btn small">Next ›</button>
      </div>
    </section>
    <section class="card">
      <h2>Layout</h2>
      <div class="layout-list" id="layout-list"></div>
    </section>
    <section class="card">
      <h2>Colour grade</h2>
      <div class="grade-list" id="grade-list"></div>
    </section>
    <section class="card">
      <h2>Effects</h2>
      <label class="field">Grade strength <input id="fx-strength" type="range" min="0" max="1" step="0.01"></label>
      <label class="field">Film grain <input id="fx-grain" type="range" min="0" max="1" step="0.01"></label>
      <label class="field">Vignette <input id="fx-vignette" type="range" min="0" max="1" step="0.01"></label>
      <label class="field">Glow <input id="fx-glow" type="range" min="0" max="1" step="0.01"></label>
      <label class="field">Borders <input id="fx-border" type="range" min="4" max="40" step="1"></label>
    </section>
  </aside>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
